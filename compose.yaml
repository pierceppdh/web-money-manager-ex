# Dockhand Git stack (compose path: compose.yaml)
#
# App code is baked into the image from Git. Persistent data stays on the NAS.
#
# Stack variable (exact name, no spaces):
#   WEBMMX_PORT=9080
# WEBMM_PORT is ignored. Default is 9080 if WEBMMX_PORT is unset.

services:
  webmmxapp:
    container_name: webmmxapp
    build: .
    image: webmmxapp:latest
    restart: unless-stopped
    ports:
      - target: 80
        published: ${WEBMMX_PORT:-9080}
        protocol: tcp
    environment:
      MMEX_DATA_DIR: /data
      MMEX_DB_PATH: /data/MMEX_New_Transaction.db
      MMEX_CONFIG_PATH: /data/configuration_user.php
      MMEX_ATTACHMENTS_DIR: /data/attachments
    volumes:
      - ${WEBMMX_DATA:-/data/webmmxapp}:/data
    dns:
      - "${WEBMMX_DNS:-192.168.0.25}"
